{% extends 'base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issues</title>
</head>
<body>

    <h1 style="text-align: center" >&emsp;Report Issues</h1>
    <p style="color: #666;">&emsp;&emsp;&emsp;&emsp;Need help with your purchases or services? You're in the right place to find answers, fix issues, or contact our our support.</p>
    <hr style="margin-bottom: 25px;">

<form action="{% url 'supports:report' %}" method="POST" enctype="multipart/form-data" class="contact-form mb-3">
    {% csrf_token %}
    
    <div class="row">
        <div class="col-sm-4">
            <label for="cname" class="sr-only">Name *</label>
            <input type="text" class="form-control" id="cname" name="name" placeholder="Name *" required>
        </div><!-- End .col-sm-4 -->

        <div class="col-sm-4">
            <label for="cemail" class="sr-only">Email *</label>
            <input type="email" class="form-control" id="cemail" name="email" placeholder="Email *" required>
        </div><!-- End .col-sm-4 -->

        <div class="col-sm-4">
            <label for="cphone" class="sr-only">Phone</label>
            <input type="tel" class="form-control" id="cphone" name="phone" placeholder="Phone">
        </div><!-- End .col-sm-4 -->
    </div><!-- End .row -->

    <label for="csubject" class="sr-only">Subject</label>
    <input type="text" class="form-control" id="csubject" name="subject" placeholder="Subject" required>

    <label for="cmessage" class="sr-only">Message *</label>
    <textarea class="form-control" cols="30" rows="4" id="cmessage" name="message" placeholder="Message *" required></textarea>
    <div class="form-group mb-3">
        <label for="cphoto" style="font-size: 1.4rem; color: #666; margin-bottom: 0.5rem; display: block;">
            &emsp;Upload a photo/screenshot (optional)
        </label>
        <input type="file" name="photo" multiple class="form-control" id="cphoto" name="photo" accept="image/*" style="padding: 0.8rem 1.2rem; height: auto;">
    </div>

    <button type="submit" class="btn btn-outline-primary-2 btn-minwidth-sm">
        <span>SUBMIT</span>
        <i class="icon-long-arrow-right"></i>
    </button>
</form>


</body>
</html>
{% endblock %}
